{% extends "base.html" %}


{% block content %}
<main class="container">
    <div class="card">
        <form action="{% url 'users:registration' %}" method="post">
            {% csrf_token %}
            {% for field in form %}
                {{ field.label_tag }}
                <br>
                {{ field }}
                <br>
            {% endfor %}
            <br>
            <button class="search-btn" type="submit">Зарегистрироваться</button>
        </form>
    </div>
</main>
{% endblock content %}
