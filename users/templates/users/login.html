{% extends 'base.html' %}

{% block content %}
  <main class="container">
    <div class="card">
      <form action="{% url 'users:login' %}" method="post">
        {% csrf_token %}
        {% for field in form %}
            {{ field.label_tag }}
            <br>
            {{ field }}
            <br>
        {% endfor %}
        <br />
        <button type="submit" class="search-btn">Войти</button>
      </form>
    </div>
  </main>
{% endblock %}
